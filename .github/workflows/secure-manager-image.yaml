name: Secure Manager server image

on:
  workflow_dispatch:
  push:
    tags:
      - 'secure-v*'

concurrency:
  group: secure-manager-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/lightning-codes/scylla-manager

jobs:
  test:
    name: Security-focused tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Run focused security tests
        run: |
          go test -short -mod=vendor \
            ./pkg/secrets \
            ./pkg/store \
            ./pkg/service/cluster \
            ./pkg/service/configcache \
            ./pkg/service/healthcheck \
            ./pkg/restapi \
            ./pkg/ping/dynamoping \
            ./pkg/cmd/sctool
          go test -short -race -mod=vendor ./pkg/scyllaclient \
            -run '^TestCachedProvider(InvalidateClosesIdleTransport|InvalidateRevokesOutstandingClient|InvalidateRetainsStableCell|RevokesEveryReplacedGeneration)$'

  publish:
    name: Build, publish, and attest Manager server
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Scylla Manager server
            org.opencontainers.image.description=Strict-TLS Scylla Manager server (Agent image is intentionally not published)
      - name: Build and push linux/amd64 and linux/arm64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: dist/docker/scylla-manager-secure.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: false
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SPDX JSON SBOM for the immutable image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: scylla-manager.spdx.json
          artifact-name: scylla-manager-${{ github.sha }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attest SPDX SBOM with GitHub OIDC
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: scylla-manager.spdx.json
          push-to-registry: true
      - name: Attest build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
